<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Murach's Survey</title>
    <link rel="stylesheet" href="styles/survey.css" type="text/css"/>
</head>
<body>

<main class="survey-card">

    <header>
        <img src="images/murachlogo.png" alt="Murach Logo" width="100">
        <h1>Survey</h1>
        <p>If you have a moment, we'd appreciate it if you would fill out this survey</p>
    </header>

    <form action="survey" method="post">

        <section>
            <h2>Your information</h2>

            <!-- TÁCH H2 RA NGOÀI, CHỈ BỌC CÁC CẶP LABEL/INPUT VÀO GRID -->
            <div class="form-grid">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" name="firstName" required>

                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" name="lastName" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dateOfBirth">
            </div>
        </section>

        <section>
            <h2>How did you hear about us?</h2>
            <div class="radio-group">
                <label><input type="radio" name="hearAbout" value="Search engine" checked> Search engine</label>
                <label><input type="radio" name="hearAbout" value="Word of mouth"> Word of mouth</label>
                <label><input type="radio" name="hearAbout" value="Social Media"> Social Media</label>
                <label><input type="radio" name="hearAbout" value="Other"> Other</label>
            </div>
        </section>

        <section>
            <h2>Would you like to receive announcements about new CDs and special offers?</h2>
            <div class="checkbox-group">
                <label><input type="checkbox" name="cdsOK" value="yes"> YES, I'd like that.</label>
                <label><input type="checkbox" name="emailOK" value="yes"> YES, please send me email announcements.</label>
            </div>
        </section>

        <section class="contact-section">
            <label for="contactVia">Please contact me by:</label>
            <select id="contactVia" name="contactVia">
                <option value="Email or postal mail">Email or postal mail</option>
                <option value="Email only">Email only</option>
                <option value="Postal mail only">Postal mail only</option>
            </select>
        </section>

        <aside>
            <button type="submit" class="btn-submit">Submit</button>
        </aside>

    </form>

    <footer>
        <p>&copy; Murach's Java Servlets and JSP</p>
    </footer>
</main>

</body>
</html>
